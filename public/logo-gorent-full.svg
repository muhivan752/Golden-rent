<svg viewBox="0 0 520 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon box -->
  <rect width="100" height="100" x="10" y="10" rx="24" fill="url(#icon-grad)"/>

  <!-- Stylized "G" -->
  <path
    d="M76 60h-16"
    stroke="white"
    stroke-width="7"
    stroke-linecap="round"
  />
  <path
    d="M76 60a20 20 0 1 0-10 17.3"
    stroke="white"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Speed lines -->
  <line x1="28" y1="48" x2="38" y2="48" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <line x1="25" y1="60" x2="35" y2="60" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  <line x1="28" y1="72" x2="38" y2="72" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

  <!-- "Go" text bold -->
  <text x="130" y="82" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="72" fill="#0f172a">Go</text>

  <!-- "Rent" text medium -->
